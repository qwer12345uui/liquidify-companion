name: Build OpenMinis iOS 15 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios15.yml'
      - 'patches/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Start build log
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          {
            echo "=== OpenMinis iOS 15 build, run $GITHUB_RUN_NUMBER ==="
            echo "=== runner ==="
            sw_vers
            echo "--- installed Xcodes ---"
            ls /Applications | grep -i xcode || true
            echo "--- active Xcode ---"
            xcodebuild -version
            echo "--- iOS SDK ---"
            xcrun --sdk iphoneos --show-sdk-version
          } > "$LOG" 2>&1

      - name: Clone, patch, build deps, archive
        id: build
        continue-on-error: true
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"

          echo "=== STEP: clone upstream ===" >> "$LOG"
          git clone --recurse-submodules --depth 1 \
            https://github.com/OpenMinis/OpenMinis.git upstream >> "$LOG" 2>&1
          echo "deps/ish entries: $(ls upstream/deps/ish 2>/dev/null | wc -l)" >> "$LOG"

          echo "=== STEP: apply iOS 15 patches ===" >> "$LOG"
          cp patches/ios15.sh upstream/patches-ios15.sh
          ( cd upstream && bash patches-ios15.sh ) >> "$LOG" 2>&1

          echo "=== STEP: install build tools ===" >> "$LOG"
          brew install ninja llvm libarchive pkg-config >> "$LOG" 2>&1
          pip3 install --quiet --break-system-packages meson >> "$LOG" 2>&1

          echo "=== STEP: build LAME ===" >> "$LOG"
          ( cd upstream && chmod +x deps/*.sh && ./deps/build_lame.sh ) >> "$LOG" 2>&1

          echo "=== STEP: build FFmpeg ===" >> "$LOG"
          ( cd upstream && ./deps/build_ffmpeg.sh ) >> "$LOG" 2>&1

          echo "=== STEP: build iSH ===" >> "$LOG"
          ( cd upstream && ./deps/build_ish.sh ) >> "$LOG" 2>&1

          echo "=== STEP: prepare Alpine rootfs ===" >> "$LOG"
          ( cd upstream && ./deps/prepare_alpine_rootfs.sh ) >> "$LOG" 2>&1

          echo "=== STEP: xcodebuild archive ===" >> "$LOG"
          ( cd upstream && xcodebuild \
              -project src/ios/Minis.xcodeproj \
              -scheme Minis \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/Minis.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              archive ) >> "$LOG" 2>&1

          echo "=== build script finished ===" >> "$LOG"

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build.log
          git commit -m "build log for run $GITHUB_RUN_NUMBER" || echo "nothing to commit"
          git push -f origin "HEAD:ci-logs" || echo "log push failed"

      - name: Package IPA
        if: always()
        run: |
          set +e
          if [ -d upstream/build/Minis.xcarchive ]; then
            mkdir -p ipa/Payload
            cp -R upstream/build/Minis.xcarchive/Products/Applications/*.app ipa/Payload/
            ( cd ipa && zip -qry "$GITHUB_WORKSPACE/Minis-iOS15-unsigned.ipa" Payload )
            echo "IPA packaged:"
            ls -lh "$GITHUB_WORKSPACE/Minis-iOS15-unsigned.ipa"
          else
            echo "no xcarchive produced - skipping IPA packaging"
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-iOS15-unsigned-ipa
          path: Minis-iOS15-unsigned.ipa
          if-no-files-found: ignore

      - name: Attach IPA to release
        if: hashFiles('Minis-iOS15-unsigned.ipa') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios15-build-${{ github.run_number }}
          name: OpenMinis iOS 15 build ${{ github.run_number }}
          body: |
            Unsigned IPA built with `IPHONEOS_DEPLOYMENT_TARGET = 15.0`.
            Installs on jailbroken devices; re-sign for stock devices.
          files: Minis-iOS15-unsigned.ipa
